name: Antigravity CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  antigravity-checks:
    name: Antigravity build, validate, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Verify generated plugins match sources and overrides
        run: node scripts/antigravity/build.mjs --check

      - name: Validate Antigravity plugin manifests, logos, skills, and agents
        run: node scripts/antigravity/validate.mjs --strict

      - name: Run Antigravity port tests
        run: |
          node scripts/tests/test-antigravity-frontmatter.mjs
          node scripts/tests/test-antigravity-build.mjs
          node scripts/tests/test-antigravity-validate.mjs
          node scripts/tests/test-antigravity-install.mjs
          node scripts/tests/test-antigravity-release-zip.mjs
