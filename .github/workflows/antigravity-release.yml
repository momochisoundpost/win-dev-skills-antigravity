name: Antigravity Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish win-dev-skills-antigravity.zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Verify generated plugins and run tests
        run: |
          node scripts/antigravity/build.mjs --check
          node scripts/antigravity/validate.mjs --strict
          node scripts/tests/test-antigravity-frontmatter.mjs
          node scripts/tests/test-antigravity-build.mjs
          node scripts/tests/test-antigravity-validate.mjs
          node scripts/tests/test-antigravity-install.mjs
          node scripts/tests/test-antigravity-release-zip.mjs

      - name: Package release zip
        run: node scripts/antigravity/package-release.mjs --out win-dev-skills-antigravity.zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" win-dev-skills-antigravity.zip --generate-notes
